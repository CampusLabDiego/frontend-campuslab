<div class="page-container">
  <app-page-header></app-page-header>

  <section class="page-card">
    <h1>📚 Catálogo</h1>

    <p>Gestión de laboratorios, equipos e insumos disponibles</p>

    <div class="toolbar">
      <input
        type="search"
        placeholder="Buscar recurso..."
        aria-label="Buscar recurso"
        [(ngModel)]="busqueda"
        (input)="filtrar()">
    </div>

    <div class="content-box">
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Tipo</th>
            <th>Estado</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let recurso of recursosPagina">
            <td>{{ recurso.name }}</td>
            <td>{{ recurso.type }}</td>
            <td>{{ recurso.active ? 'Activo' : 'Inactivo' }}</td>
          </tr>
        </tbody>
      </table>

      <p *ngIf="recursosFiltrados.length === 0">
        No hay recursos para mostrar.
      </p>

      <div class="pagination" *ngIf="recursosFiltrados.length > elementosPagina">
        <button
          type="button"
          [disabled]="paginaActual === 1"
          (click)="cambiarPagina(paginaActual - 1)">
          Anterior
        </button>

        <span>Página {{ paginaActual }}</span>

        <button
          type="button"
          [disabled]="paginaActual * elementosPagina >= recursosFiltrados.length"
          (click)="cambiarPagina(paginaActual + 1)">
          Siguiente
        </button>
      </div>
    </div>
  </section>
</div>
